<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andrew Grau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<style>
/* ============================================================
   Colors sampled from the sky130 layout in Cadence Virtuoso
   ============================================================ */
:root{
  --bg:#000;
  --li1:#baab90;  --li1-hi:#d4c493;   /* li1 drawing (cream)   */
  --met1:#0000c0; --met1-lo:#00009a;  /* met1 drawing (blue)   */
  --poly:#e43222;                     /* poly drawing (red)    */
  --mcon:#961de7;                     /* mcon / via (purple)   */
  --diff:#5cc971;                     /* diff drawing (green)  */
  --tap:#d0c641;                      /* tap drawing (yellow)  */
  --nwell:#7516bb;                    /* nwell outline         */
  --ui:#4b4b4b; --ui-hi:#5d5d5d; --ui-lo:#3f3f3f; --ui-edge:#262626; --ui-text:#e3e3e3;
  --uifont:'Noto Sans','DejaVu Sans','Segoe UI',system-ui,sans-serif;
  --text:#ececec;
  --muted:#9a9a9a;
  --gut:48px;
  --measure:640px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  color:var(--text);
  font-family:'Archivo',system-ui,sans-serif;
  font-variation-settings:'wdth' 100,'wght' 400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-top:30px;padding-bottom:23px;
  /* layout canvas: black, sparse grid, brighter dot every 5th */
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at center,#c3c3c3 0 1.1px,transparent 1.5px),
    radial-gradient(circle at center,#4e4e4e 0 .9px,transparent 1.3px);
  background-size:140px 140px,28px 28px;
  background-position:-56px -56px,0 0;
}
body.off-grid{background-image:none;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:1px dashed #fff;outline-offset:3px;}
#hero,#bg-canvas{z-index:1;}
.view{position:relative;z-index:1;}

/* ---------- Cadence (Qt) style buttons ---------- */
.cbtn,#redo-btn,.cta,.back,.cnav,.mtools button,#lsw-tab{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--uifont);font-size:13px;font-weight:400;letter-spacing:0;
  color:var(--ui-text);cursor:pointer;
  background:linear-gradient(180deg,#636363,#4a4a4a);
  border:1px solid var(--ui-edge);border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.25);
  padding:4px 12px;line-height:1.4;
}
.cbtn:hover,#redo-btn:hover,.cta:hover,.back:hover,.cnav:hover,.mtools button:hover,#lsw-tab:hover{
  background:linear-gradient(180deg,#707070,#555);
}
.cbtn:active,#redo-btn:active,.cta:active,.back:active,.cnav:active,.mtools button:active,#lsw-tab:active{
  background:linear-gradient(180deg,#3d3d3d,#474747);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.45);
}

/* ---------- menu bar ---------- */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:80;height:30px;
  display:flex;align-items:center;gap:0;padding:0 8px;
  background:var(--ui);border-bottom:1px solid var(--ui-edge);
  box-shadow:inset 0 -1px 0 var(--ui-hi);
  font-family:var(--uifont);font-size:13px;color:var(--ui-text);
}
#nav .mark{font-weight:700;padding:0 14px 0 6px;margin-right:6px;border-right:1px solid var(--ui-lo);}
#nav a.link{display:inline-block;padding:4px 9px;border-radius:2px;}
#nav a.link::first-letter{text-decoration:underline;}
#nav a.link:hover{background:var(--ui-hi);}
#nav a.link.active{background:var(--ui-lo);box-shadow:inset 0 1px 2px rgba(0,0,0,.4);}

/* ---------- status bar (from the Virtuoso window) ---------- */
#vbar{
  position:fixed;left:0;right:0;bottom:0;z-index:80;height:23px;
  display:flex;align-items:center;gap:26px;padding:0 10px;
  background:var(--ui);border-top:1px solid var(--ui-edge);box-shadow:inset 0 1px 0 var(--ui-hi);
  font-family:var(--uifont);font-size:12px;color:var(--ui-text);white-space:nowrap;overflow:hidden;
}
#vbar .grip{width:3px;height:13px;border-left:1px solid #2e2e2e;border-right:1px solid #6a6a6a;margin-right:-18px;}
#vbar .lay{display:none;align-items:center;gap:6px;margin-left:auto;}
#vbar .lay.on{display:flex;}
#vbar #vxy{margin-left:auto;font-variant-numeric:tabular-nums;white-space:pre;}
#vbar .lay.on + #vxy{margin-left:0;}
#vbar .lay #vlayn{min-width:62px;}

/* ---------- cursor routing layer ---------- */
#wires{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

/* ---------- layer swatches (palette + status bar) ---------- */
.sw{display:inline-block;width:14px;height:11px;border:1px solid;flex:0 0 auto;}
.sw-li1{border-color:var(--li1);background:radial-gradient(circle,rgba(0,0,0,.6) .8px,transparent 1.2px) 0 0/3px 3px,var(--li1);}
.sw-met1{border-color:#4a4aff;background:repeating-conic-gradient(#2020ff 0 25%,#000 0 50%) 0 0/2px 2px;}
.sw-poly{border-color:var(--poly);background:repeating-linear-gradient(45deg,var(--poly) 0 1px,transparent 1px 3px);}
.sw-diff{border-color:#7dff7d;background:repeating-conic-gradient(#bcd9aa 0 25%,#d8ecc9 0 50%) 0 0/2px 2px;}
.sw-tap{border-color:var(--tap);background:repeating-conic-gradient(var(--tap) 0 25%,#2c2808 0 50%) 0 0/2px 2px;}
.sw-mcon{border-color:var(--mcon);background:var(--mcon);}
.sw-grid{border-color:#777;background:radial-gradient(circle,#c3c3c3 .7px,transparent 1px) 0 0/4px 4px,#000;}

/* ---------- Layers palette (LSW) ---------- */
#lsw{position:fixed;left:10px;bottom:31px;z-index:85;font-family:var(--uifont);font-size:12px;color:var(--ui-text);}
#lsw-panel{
  width:224px;margin-bottom:6px;background:var(--ui);border:1px solid var(--ui-edge);
  box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#lsw-panel[hidden]{display:none;}
.lsw-hd{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 8px;background:var(--ui-lo);font-weight:700;}
.lsw-hd button{background:none;border:0;color:var(--ui-text);cursor:pointer;font-size:12px;padding:0 4px;}
.lsw-cols,.lsw-row{display:grid;grid-template-columns:18px 1fr 38px 20px;gap:6px;align-items:center;padding:3px 8px;}
.lsw-cols{border-bottom:1px solid var(--ui-lo);background:var(--ui-hi);font-size:11.5px;}
.lsw-cols span:nth-child(3),.lsw-cols span:nth-child(4){text-align:center;}
.lsw-row{cursor:pointer;}
.lsw-row:hover{outline:1px solid #fff;outline-offset:-1px;}
.lsw-row input{margin:0 auto;accent-color:#cfcfcf;cursor:pointer;}
.lsw-foot{padding:5px 8px;border-top:1px solid var(--ui-lo);font-size:11px;color:#bdbdbd;}

/* ---------- view switching ---------- */
.view{display:none;}
.view.on{display:block;}

/* ---------- hero ---------- */
#hero{
  width:100%;height:calc(100vh - 53px);min-height:600px;background:transparent;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;cursor:crosshair;
}
#bg-canvas{position:absolute;inset:0;width:100%;height:100%;}
#scene{position:relative;width:520px;height:520px;transform-style:preserve-3d;z-index:2;will-change:transform;}
#wafer-canvas{position:absolute;inset:0;width:520px;height:520px;border-radius:50%;}
#beam-canvas{position:absolute;left:-290px;top:-290px;width:1100px;height:1100px;pointer-events:none;z-index:10;}
#name-canvas{position:absolute;inset:0;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:5;}
#redo-btn{position:absolute;top:16px;right:var(--gut);z-index:20;}
.hero-lbl{
  position:absolute;right:var(--gut);bottom:16px;z-index:3;
  font-family:var(--uifont);font-size:12px;color:#fff;
}

/* ---------- layout primitives ---------- */
.band{padding:110px var(--gut) 110px calc(var(--gut) + 40px);position:relative;}
#interests{overflow:hidden;}
.measure{max-width:var(--measure);}
h2{
  font-variation-settings:'wdth' 112,'wght' 800;
  font-size:clamp(30px,4.4vw,50px);line-height:1.02;letter-spacing:-0.035em;
  margin-bottom:26px;
}
h3{font-variation-settings:'wdth' 108,'wght' 750;font-size:22px;letter-spacing:-0.025em;margin-bottom:14px;}
p{font-size:16.5px;line-height:1.72;color:#c9c9c9;max-width:62ch;}
p + p{margin-top:19px;}
.rise{display:block;}
.rise > span{display:block;}

/* heading underline: a poly finger landing on an mcon */
.wipe{
  position:relative;display:block;height:9px;max-width:var(--measure);margin-right:7px;
  border:1px solid var(--poly);
  background:repeating-linear-gradient(45deg,var(--poly) 0 1.4px,transparent 1.4px 5px);
}
.wipe::after{
  content:"";position:absolute;right:-8px;top:-4px;width:15px;height:15px;
  background:var(--mcon);
}
body.off-poly .wipe{border-color:transparent;background:none;}
body.off-mcon .wipe::after,body.off-mcon .via{visibility:hidden;}

/* ---------- intro ---------- */
.degree{font-variation-settings:'wdth' 100,'wght' 500;font-size:17px;color:#a8a8a8;margin-bottom:8px;}
#about-slot{margin-top:34px;}
#about-slot:empty{display:none;}

/* ---------- li1 shapes: thick dotted cream strap around a black body ---------- */
.tile{
  border:9px solid transparent;
  box-shadow:0 0 0 1px #e8dcc0,inset 0 0 0 1px #e8dcc0;
  background:
    linear-gradient(#030303,#030303) padding-box,
    radial-gradient(circle,rgba(0,0,0,.62) .9px,transparent 1.4px) 0 0/4px 4px border-box,
    linear-gradient(var(--li1),var(--li1)) border-box;
}
body.off-li1 .tile{background:linear-gradient(#030303,#030303) padding-box,linear-gradient(#1a1a1a,#1a1a1a) border-box;box-shadow:none;}
/* ---------- met1 shapes: solid blue strap ---------- */
.card,.stack .item{
  border:7px solid transparent;
  background:
    linear-gradient(#030303,#030303) padding-box,
    repeating-conic-gradient(#2020ff 0 25%,#000 0 50%) 0 0/3px 3px border-box;
  box-shadow:0 0 0 1px #4a4aff,inset 0 0 0 1px #4a4aff;
}
body.off-met1 .card,body.off-met1 .stack .item{background:linear-gradient(#030303,#030303) padding-box,linear-gradient(#1a1a1a,#1a1a1a) border-box;box-shadow:none;}

/* net labels, white like Virtuoso pin text */
.netlbl{
  position:absolute;pointer-events:none;z-index:4;
  font-family:var(--uifont);font-size:11.5px;color:#fff;line-height:1;
}

/* ---------- project tiles ---------- */
.tiles{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto auto;gap:22px;margin-top:8px;max-width:1120px;}
.tiles .tile:first-child{grid-row:1 / span 2;min-height:420px;padding:34px 30px 30px;display:flex;flex-direction:column;}
.tiles .tile:first-child .tname{font-size:34px;margin-top:22px;}
.tthumb{display:block;width:100%;flex:1 1 auto;min-height:220px;max-height:340px;object-fit:cover;margin-top:18px;border:1px solid var(--diff);background:#060606;}
.tthumb:not([src]){display:none;}
.tile{
  position:relative;display:block;overflow:visible;border-radius:0;
  padding:24px 24px 22px;min-height:200px;
  outline:1px dashed transparent;outline-offset:5px;
  transition:outline-color .12s;
  cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
}
.tile .netlbl{top:9px;right:12px;}
.tile .via{position:absolute;width:12px;height:12px;background:var(--mcon);top:-10.5px;left:22px;}
.tile:hover{outline-color:#fff;}
.tile .idx{font-size:13.5px;color:#a0a0a0;margin-bottom:auto;display:block;}
.tile .tname{font-variation-settings:'wdth' 110,'wght' 800;font-size:24px;letter-spacing:-0.03em;margin:34px 0 10px;}
.tile .tsub:empty{display:none;}
.tile .tsub{font-size:14.5px;color:#bdbdbd;line-height:1.6;max-width:38ch;}

/* ---------- interests strip ---------- */
#interests-strip{
  display:flex;gap:26px;
  margin:-26px -40px 0;padding:36px 40px 46px;scroll-padding-left:40px;
  overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;
  scrollbar-width:thin;scrollbar-color:#5d5d5d transparent;
}
#interests-strip::-webkit-scrollbar{height:6px;}
#interests-strip::-webkit-scrollbar-thumb{background:#5d5d5d;}
#interests-strip::-webkit-scrollbar-track{background:transparent;}
.card{
  scroll-snap-align:start;flex:0 0 306px;min-height:462px;position:relative;border-radius:0;
  padding:0 0 26px;display:flex;flex-direction:column;overflow:hidden;
  outline:1px dashed transparent;outline-offset:5px;transition:outline-color .12s;
}
.card .netlbl{right:12px;bottom:9px;}
.cimg{
  height:272px;overflow:hidden;flex:0 0 auto;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:#060606;border-bottom:1px solid var(--diff);
}
.cimg img,.cimg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s ease;}
.cimg img.on,.cimg video.on{opacity:1;}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:4px;justify-content:center;z-index:5;}
.dots i{width:6px;height:6px;background:rgba(0,0,0,.55);border:1px solid #9a9a9a;}
.dots i.on{background:#fff;border-color:#fff;}
.cnav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:28px;height:26px;padding:0;opacity:0;transition:opacity .2s;}
.cnav.l{left:8px;} .cnav.r{right:8px;}
.card:hover .cnav,.card:focus-within .cnav{opacity:1;}
.cnav svg{width:13px;height:13px;}
#interests-strip .card:hover{outline-color:#fff;}
.card .ct{font-variation-settings:'wdth' 108,'wght' 740;font-size:21px;letter-spacing:-0.025em;margin:0 22px;padding-top:20px;}
.card .cn{font-size:14px;color:#bdbdbd;line-height:1.55;margin:7px 22px 0;}
.card .cd{font-size:13.5px;color:#b0b0b0;line-height:1.62;margin:12px 22px 0;overflow-wrap:anywhere;}
.card .cd:empty,.card .cn:empty{display:none;}
#interests.hide{display:none;}

/* ---------- spec table, styled like the palette's layer table ---------- */
.spec{
  margin-top:40px;max-width:600px;background:var(--ui);border:1px solid var(--ui-edge);
  font-family:var(--uifont);
}
.spec .row{
  display:grid;grid-template-columns:200px 1fr;gap:12px;
  padding:5px 10px;border-bottom:1px solid var(--ui-lo);
}
.spec .row:last-child{border-bottom:0;}
.spec .row:not(.hd):hover{outline:1px solid #fff;outline-offset:-1px;}
.spec .row.hd{background:var(--ui-hi);font-size:12px;color:#f0f0f0;}
.spec .k{font-size:13px;color:#dcdcdc;}
.spec .v{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#fff;}
.spec .row.hd .v{font-family:var(--uifont);font-size:12px;}

/* ---------- project two-column + media stack ---------- */
.proj{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:64px;align-items:start;}
.stack-wrap{position:sticky;top:70px;width:100%;max-width:430px;margin:0 auto;}
.stack{position:relative;width:100%;aspect-ratio:var(--ar,4 / 5);margin-bottom:14px;}
.stack:empty{display:none;}
.stack .item{position:absolute;inset:0;border-radius:0;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .3s ease;}
.stack .item.on{opacity:1;pointer-events:auto;}
.stack .item img,.stack .item video{width:100%;height:100%;object-fit:cover;display:block;}
.stack .item canvas{width:100%!important;height:100%!important;display:block;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;justify-content:center;}
.thumbs button{
  width:56px;height:56px;padding:0;border-radius:0;overflow:hidden;cursor:pointer;
  border:1px solid var(--ui-lo);background:#060606;opacity:.6;
  outline:1px solid transparent;outline-offset:2px;transition:opacity .2s;
}
.thumbs button img,.thumbs button video{width:100%;height:100%;object-fit:cover;display:block;}
.thumbs button.on{opacity:1;outline-color:#fff;}
.thumbs button:hover{opacity:1;}
.thumbs .tmodel{display:flex;align-items:center;justify-content:center;font-family:var(--uifont);font-size:10px;color:#cfcfcf;background:#141414;}
.mtools{position:absolute;left:10px;top:10px;z-index:6;display:flex;gap:6px;opacity:0;transition:opacity .2s;}
.stack .item:hover .mtools,.stack .item:focus-within .mtools{opacity:1;}
.stack .item.model{cursor:grab;background:#0c0c0c;}
.stack .item.model:active{cursor:grabbing;}

/* ---------- resume button ---------- */
.cta{margin-top:30px;padding:6px 14px;}
.cta svg{width:15px;height:15px;flex:0 0 auto;color:var(--tap);}

/* ---------- contact ---------- */
.contact{display:flex;flex-wrap:wrap;gap:46px;margin-top:34px;}
.contact .c a,.contact .c span{display:block;font-variation-settings:'wdth' 104,'wght' 600;font-size:19px;letter-spacing:-0.02em;}
.contact .c a:hover{color:var(--li1-hi);}
.contact .c a.li{display:flex;align-items:center;gap:10px;}
.contact .c a.li svg{width:21px;height:21px;flex:0 0 auto;}
.contact .c a.li .lbl{overflow-wrap:anywhere;}
.contact .c em{display:block;font-style:normal;font-family:var(--uifont);font-size:12px;color:#9a9a9a;margin-bottom:7px;}
.contact .c a.cta.li{display:inline-flex;font-size:13px;font-family:var(--uifont);font-weight:400;letter-spacing:0;margin-top:0;}
.contact .c a.cta.li svg{width:15px;height:15px;}
.contact .c a.cta.li:hover{color:var(--ui-text);}
.contact .c a.cta.li .lbl{font:inherit;font-size:13px;font-variation-settings:normal;letter-spacing:0;}

/* ---------- back button ---------- */
.back{margin-bottom:40px;}
.subhead{padding-top:70px;}

footer{
  padding:34px var(--gut) 34px calc(var(--gut) + 40px);border-top:1px solid #1c1c1c;
  font-size:13px;color:#8a8a8a;position:relative;z-index:1;
}

@media (max-width:1180px){
  .proj{grid-template-columns:1fr;gap:46px;}
  .stack-wrap{position:static;max-width:430px;margin:0;}
}
@media (max-width:900px){
  :root{--gut:20px;}
  body{padding-bottom:0;}
  #vbar,#lsw{display:none;}
  #nav{height:auto;flex-wrap:wrap;padding:3px 4px;row-gap:1px;}
  #nav .mark{display:none;}
  #nav a.link{padding:3px 8px;}
  body{padding-top:56px;}
  #hero{height:calc(100vh - 56px);}
  .band{padding:72px 20px;}
  .proj{grid-template-columns:1fr;gap:36px;}
  .stack-wrap{position:static;max-width:100%;margin:0;}
  .thumbs button{width:46px;height:46px;}
  .tiles{grid-template-columns:1fr;}
  .tiles .tile:first-child{grid-row:auto;min-height:260px;}
  .tiles .tile:first-child .tname{font-size:28px;}
  .card{flex-basis:262px;min-height:424px;}
  .cimg{height:232px;}
  #interests-strip{gap:20px;margin:-22px -20px 0;padding:30px 20px 40px;scroll-padding-left:20px;}
  #scene,#wafer-canvas,#name-canvas{width:340px;height:340px;}
  #beam-canvas{left:-190px;top:-190px;width:720px;height:720px;}
  .hero-lbl{display:none;}
  .spec .row{grid-template-columns:1fr;gap:2px;}
  .contact{gap:28px;}
  footer{padding:30px 20px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
</style>
</head>
<body>


<nav id="nav">
  <a class="mark" href="#/" data-e="text.mark"></a>
  <a class="link" href="#/lithora" data-e="projects.lithora.tile"></a>
  <a class="link" href="#/f1" data-e="projects.f1.tile"></a>
  <a class="link" href="#/spin" data-e="projects.spin.tile"></a>
  <a class="link" href="#/#interests">Interests</a>
  <a class="link" href="#/#contact">Contact</a>
</nav>

<!-- ======================= HOME ======================= -->
<section class="view" id="view-home">

  <div id="hero">
    <canvas id="bg-canvas"></canvas>
    <div id="scene">
      <canvas id="wafer-canvas" width="520" height="520"></canvas>
      <canvas id="name-canvas" width="520" height="520"></canvas>
      <canvas id="beam-canvas" width="1100" height="1100"></canvas>
    </div>
    <button id="redo-btn">Replay</button>
    <span class="hero-lbl">cell: wafer</span>
  </div>

  <div class="band rv">
    <div class="measure">
      <h2>
        <span class="rise" style="--d:0ms"><span data-e="text.headline.0"></span></span>
        <span class="rise" style="--d:90ms"><span data-e="text.headline.1"></span></span>
        <span class="rise" style="--d:180ms"><span data-e="text.headline.2"></span></span>
        <span class="rise" style="--d:270ms"><span data-e="text.headline.3"></span></span>
      </h2>

const isVid=d=>typeof d==='string' &&
  (d.startsWith('data:video') || /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(d));
const mediaTag=(d,cls)=>isVid(d)
  ? '<video'+(cls?' class="'+cls+'"':'')+' src="'+d+'" muted loop playsinline preload="metadata"></video>'
  : '<img'+(cls?' class="'+cls+'"':'')+' src="'+d+'" alt="" loading="lazy" decoding="async">';

const getPath=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],CONTENT);

/* ---------------- text ---------------- */
function bindText(){
  document.querySelectorAll('[data-e]').forEach(el=>{
    const v=getPath(el.dataset.e);
    if(el.tagName==='A' && el.dataset.mail!==undefined){
      el.textContent=v||''; el.href='mailto:'+(v||'');
    } else if(el.tagName==='A' && el.dataset.link!==undefined){
      el.href=v||'#';
      el.querySelector('.lbl').textContent=el.dataset.label||'Link';
    } else el.textContent=v||'';
  });
}
function prose(el,path,firstStyle){
  const t=(getPath(path)||'').trim();
  const st=firstStyle?' style="margin-top:28px"':'';
  el.innerHTML = t ? '<p'+st+'>'+t.split(/\n\s*\n/).join('</p><p>')+'</p>' : '';
}
function specs(el,path){
  el.innerHTML='<div class="row hd"><div class="k">Property</div><div class="v">Value</div></div>'+(getPath(path)||[]).map(([k,v])=>
    '<div class="row"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('');
}

/* ---------------- projects ---------------- */
function renderProjects(){
  ['lithora','f1','spin'].forEach(k=>{
    const i=document.querySelector('[data-intro="'+k+'"]'); if(i) prose(i,'projects.'+k+'.intro',true);
    const sp=document.querySelector('[data-spec="'+k+'"]'); if(sp) specs(sp,'projects.'+k+'.specs');
    const ex=document.querySelector('[data-extra="'+k+'"]');
    if(ex){
      const t=(getPath('projects.'+k+'.extraTitle')||'').trim();
      const b=(getPath('projects.'+k+'.extra')||'').trim();
      if(!t && !b){ ex.innerHTML=''; return; }
      ex.innerHTML='<h3 style="margin-top:56px">'+t+'</h3><div data-prose></div>';
      prose(ex.querySelector('[data-prose]'),'projects.'+k+'.extra',false);
    }
  });
}

/* ---------------- media stacks ---------------- */
function applyRatio(st,card){
  if(!card) return;
  if(card.classList.contains('model')){ st.style.setProperty('--ar','4 / 3'); return; }
  const v=card.querySelector('video');
  if(v){
    if(v.videoWidth) st.style.setProperty('--ar',v.videoWidth+' / '+v.videoHeight);
    v.play().catch(()=>{});
    return;
  }
  const img=card.querySelector('img');
  if(img && img.naturalWidth) st.style.setProperty('--ar',img.naturalWidth+' / '+img.naturalHeight);
}
function setFront(st,n){
  const cards=[...st.querySelectorAll('.item')];
  cards.forEach((c,k)=>{
    c.classList.toggle('on',k===n);
    const v=c.querySelector('video');
    if(v && k!==n){ v.pause(); v.currentTime=0; }
  });
  st.parentElement.querySelectorAll('.thumbs button').forEach((b,k)=>b.classList.toggle('on',k===n));
  applyRatio(st,cards[n]);
}
function renderStack(key){
  const st=document.querySelector('[data-stack="'+key+'"]'); if(!st) return;
  const wrap=st.parentElement, m=CONTENT.media[key];
  const items=m.images.map(d=>({kind:'img',data:d}));
  if(m.model) items.push({kind:'model'});
  if(!items.length){ wrap.style.display='none'; return; }

  st.innerHTML=items.map((it,n)=>{
    const on=n===0?' on':'';
    return it.kind==='img'
      ? '<div class="item'+on+'">'+mediaTag(it.data)+'</div>'
      : '<div class="item model'+on+'"></div>';
  }).join('');

  st.querySelectorAll('img').forEach(img=>{
    const fit=()=>{ const c=img.closest('.item'); if(c.classList.contains('on')) applyRatio(st,c); };
    img.complete ? fit() : img.addEventListener('load',fit);
  });
  st.querySelectorAll('video').forEach(v=>v.addEventListener('loadedmetadata',()=>{
    const c=v.closest('.item'); if(c.classList.contains('on')) applyRatio(st,c);
  }));
  applyRatio(st, st.querySelector('.item.on'));

  if(items.length>1){
    const rail=document.createElement('div'); rail.className='thumbs';
    rail.innerHTML=items.map((it,n)=>
      it.kind==='img'
        ? '<button'+(n===0?' class="on"':'')+' aria-label="Item '+(n+1)+'">'+
          (isVid(it.data)?'<video src="'+it.data+'" muted playsinline preload="metadata"></video>':
                          '<img src="'+it.data+'" alt="" loading="lazy" decoding="async">')+'</button>'
        : '<button class="tmodel'+(n===0?' on':'')+'" aria-label="3D model">3D</button>').join('');
    rail.querySelectorAll('button').forEach((b,n)=>b.onclick=()=>setFront(st,n));

<script type="module">
/* ---------------- 3D model viewers ---------------- */
let THREE, STLLoader, GLTFLoader, TrackballControls, libOK = true;
try {
  THREE = await import('three');
  ({STLLoader}         = await import('three/addons/loaders/STLLoader.js'));
  ({GLTFLoader}        = await import('three/addons/loaders/GLTFLoader.js'));
  ({TrackballControls} = await import('three/addons/controls/TrackballControls.js'));
} catch (err) { libOK = false; }

async function toBuf(d){
  if(!d.startsWith('data:')) return (await fetch(d)).arrayBuffer();
  const bin=atob(d.split(',')[1]);
  const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u.buffer;
}

function frame(obj, cam, ctrl){
  const box=new THREE.Box3().setFromObject(obj);
  const sph=box.getBoundingSphere(new THREE.Sphere());
  obj.position.sub(sph.center);              // centre on origin
  const r=sph.radius||1;
  cam.near=r/100; cam.far=r*100; cam.updateProjectionMatrix();
  cam.position.set(r*1.5, r*1.2, r*2.0);
  cam.lookAt(0,0,0);
  ctrl.target.set(0,0,0);
  ctrl.maxDistance=r*12; ctrl.minDistance=r*0.35;
  ctrl.update();
}

async function build(card, key){
  const m=CONTENT.media[key].model;
  const w=card.clientWidth||420, h=card.clientHeight||376;

  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  card.insertBefore(renderer.domElement, card.firstChild);

  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(42,w/h,0.1,5000);
  const pivot=new THREE.Group(); scene.add(pivot);

  const buf=await toBuf(m.data);
  let obj;
  if(/\.(glb|gltf)$/i.test(m.name)){
    const g=await new GLTFLoader().parseAsync(buf,'');
    obj=g.scene;                                  // keeps the file's own materials
  }else{
    const geo=new STLLoader().parse(buf);
    geo.computeVertexNormals();
    obj=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
      color:0xc3c7d2, metalness:.12, roughness:.62
    }));
  }
  pivot.add(obj);
  pivot.rotation.x = (m.up==='z') ? -Math.PI/2 : 0;

  scene.add(new THREE.HemisphereLight(0xeaeefb,0x2a2c36,1.05));
  scene.add(new THREE.AmbientLight(0xffffff,0.35));
  const k=new THREE.DirectionalLight(0xffffff,2.3); k.position.set(1,1.5,1.1); scene.add(k);
  const f=new THREE.DirectionalLight(0xeff3ff,0.85); f.position.set(-1.1,.3,1.3); scene.add(f);
  const rim=new THREE.DirectionalLight(0xa98cff,0.55); rim.position.set(-1.3,-.2,-1.3); scene.add(rim);

  // trackball: unrestricted tumbling in every direction, no pole clamp
  const ctrl=new TrackballControls(cam, renderer.domElement);
  ctrl.rotateSpeed=3.2;
  ctrl.zoomSpeed=1.1;
  ctrl.noPan=false;
  ctrl.staticMoving=false;
  ctrl.dynamicDampingFactor=0.13;

  frame(pivot, cam, ctrl);

  new ResizeObserver(()=>{
    const W=card.clientWidth,H=card.clientHeight;
    if(!W||!H) return;
    renderer.setSize(W,H); cam.aspect=W/H; cam.updateProjectionMatrix(); ctrl.handleResize();
  }).observe(card);

  (function loop(){ requestAnimationFrame(loop); ctrl.update(); renderer.render(scene,cam); })();

  // on-card controls
  const tools=document.createElement('div'); tools.className='mtools';
  tools.innerHTML='<button data-a="up" title="Flip up-axis (Z-up / Y-up)">Z↑</button>'+
                  '<button data-a="reset" title="Reset view">Reset</button>';
  card.appendChild(tools);
  tools.querySelector('[data-a="up"]').onclick=e=>{
    e.stopPropagation();
    m.up = (m.up==='z') ? 'y' : 'z';
    pivot.rotation.x = (m.up==='z') ? -Math.PI/2 : 0;
    e.target.textContent = (m.up==='z') ? 'Z↑' : 'Y↑';
    frame(pivot, cam, ctrl);
  };
  tools.querySelector('[data-a="reset"]').onclick=e=>{
    e.stopPropagation(); ctrl.reset(); frame(pivot, cam, ctrl);
  };
  tools.querySelector('[data-a="up"]').textContent = (m.up==='z') ? 'Z↑' : 'Y↑';
}

window.renderModels=function(){
  ['lithora','f1','spin'].forEach(key=>{
    const card=document.querySelector('[data-stack="'+key+'"] .item.model');
    if(!card || card.dataset.mounted) return;
    if(!CONTENT.media[key].model) return;
    card.dataset.mounted='1';
    if(!libOK){
      card.insertAdjacentHTML('afterbegin',
        '<div class="hint" style="padding:24px;text-align:center">3D viewer could not load</div>');
      return;
    }
    build(card,key).catch(()=>{
      card.insertAdjacentHTML('afterbegin',
        '<div class="hint" style="padding:24px;text-align:center">Could not read this model file</div>');
    });
  });
};

window.renderModels();
</script>


<script>
/* ============================================================
   WAFER HERO — v19
   ============================================================ */
const hero=document.getElementById('hero');
const scene=document.getElementById('scene');
const bgC=document.getElementById('bg-canvas');
const wc=document.getElementById('wafer-canvas');
const nc=document.getElementById('name-canvas');
const bc=document.getElementById('beam-canvas');
const bgX=bgC.getContext('2d');
const wX=wc.getContext('2d');
const nX=nc.getContext('2d');
const bX=bc.getContext('2d');
const W=520,R=246,CX=W/2,CY=W/2;
const BW=1100,BOFF=290;
const DPR=Math.min(window.devicePixelRatio||1,3);
const SMALL=matchMedia('(max-width:900px)');
let K=DPR;                                   // device pixels per wafer unit
function sizeCanvases(){
  K=(SMALL.matches?340/W:1)*DPR;
  [[wc,W],[nc,W],[bc,BW]].forEach(([c,sz])=>{c.width=Math.round(sz*K);c.height=Math.round(sz*K);});
  [wX,nX,bX].forEach(x=>x.setTransform(K,0,0,K,0,0));
}
sizeCanvases();
let heroActive=true;

function resizeBg(){bgC.width=hero.offsetWidth;bgC.height=hero.offsetHeight;}
resizeBg();
addEventListener('resize',resizeBg);

let targetTX=0,targetTY=0,currentTX=0,currentTY=0;
let mouseNX=0,mouseNY=0,currentMNX=0,currentMNY=0;


function drawBg(ts){
  const bw=bgC.width,bh=bgC.height;
  bgX.clearRect(0,0,bw,bh);
}

// ---- WAFER ----
const offWaferBase=document.createElement('canvas');
const offCtx=offWaferBase.getContext('2d');
const LAYERS={li1:true,met1:true,poly:true,mcon:true};
// Layer stipples, built at device-pixel size so they stay crisp
function makePats(ctx,sc=1/DPR){
  const mk=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));
    const pt=ctx.createPattern(c,'repeat'); if(pt.setTransform&&sc!==1) pt.setTransform(new DOMMatrix().scale(sc)); return pt;};
  const chk=(a,b)=>(g=>{g.fillStyle=b;g.fillRect(0,0,4,4);g.fillStyle=a;g.fillRect(0,0,2,2);g.fillRect(2,2,2,2);});
  return {
    met1: mk(4,4,chk('#2a2aff','#000000')),
    tap:  mk(4,4,chk('#d0c641','#2c2808')),
    diff: mk(4,4,chk('#d4e9c4','#a9cf94')),
    li1:  mk(6,6,g=>{g.fillStyle='#ddd1b2';g.fillRect(0,0,6,6);g.fillStyle='#efe6cf';g.fillRect(1,1,2,2);g.fillRect(4,4,2,2);}),
    poly: mk(6,6,g=>{g.fillStyle='rgba(228,50,34,.22)';g.fillRect(0,0,6,6);g.strokeStyle='#e43222';g.lineWidth=1.2;
            g.beginPath();g.moveTo(-1,7);g.lineTo(7,-1);g.moveTo(5,7);g.lineTo(7,5);g.moveTo(-1,1);g.lineTo(1,-1);g.stroke();}),
    nwell:mk(7,7,g=>{g.fillStyle='rgba(92,201,113,.85)';g.fillRect(1,1,1,1);g.fillStyle='rgba(228,50,34,.6)';g.fillRect(4,4,1,1);}),
    sram: mk(4,4,g=>{g.fillStyle='#0b0b10';g.fillRect(0,0,4,4);g.fillStyle='#b8452f';g.fillRect(0,0,1,4);
            g.fillStyle='#a99d80';g.fillRect(0,2,4,1);g.fillStyle='#2a2ad0';g.fillRect(2,0,1,1);})
  };
}
// One die = one chip, laid out the way real chips are: seal ring at the edge, a ring of
// I/O pad cells (bond pad + ESD/driver) with corner cells, power pads strapped into a
// VDD/VSS core ring, SRAM macros at the core periphery with their own rings, an analog/PLL
// block with a spiral inductor, standard-cell rows under a power-stripe mesh, and test
// structures (alignment mark, PCM pads) out in the scribe lane.
// Every die on a wafer is the same chip, so one die is drawn and stamped across.
// Geometry is in grid units (1 unit = half a CSS pixel = exactly 1 device pixel on a
// retina screen), and every edge is snapped to whole pixels so nothing is anti-aliased.
const CU=96, CHU=96, PU=100, PVU=100;        // die size and stepping pitch (scribe = 4), grid units
let WP=null;
let F=1, OXU=0, OYU=0;                       // device px per unit, die origin (units)
const px=v=>Math.round(v*F);
// One layer shape = a union of rects, filled, then outlined like a merged polygon:
// an edge pixel is drawn only where the shape actually borders the outside.
function shape(c,rects,fill,edge){
  const R=rects.map(([x,y,w,h])=>{const x0=px(OXU+x),y0=px(OYU+y);return [x0,y0,px(OXU+x+w)-x0,px(OYU+y+h)-y0];});
  if(fill){c.fillStyle=fill;R.forEach(([x,y,w,h])=>c.fillRect(x,y,w,h));}
  if(!edge) return;
  const inU=(u,v)=>R.some(([x,y,w,h])=>u>=x&&u<x+w&&v>=y&&v<y+h);
  const edgePx=(u,v)=>{for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(!inU(u+a,v+b))return true;return false;};
  c.fillStyle=edge;
  for(const [x,y,w,h] of R){
    for(let u=x;u<x+w;u++){ if(edgePx(u,y))c.fillRect(u,y,1,1); if(edgePx(u,y+h-1))c.fillRect(u,y+h-1,1,1); }
    for(let v=y;v<y+h;v++){ if(edgePx(x,v))c.fillRect(x,v,1,1); if(edgePx(x+w-1,v))c.fillRect(x+w-1,v,1,1); }
  }
}
function outline(c,[x,y,w,h],col){
  const x0=px(OXU+x),y0=px(OYU+y),x1=px(OXU+x+w),y1=px(OYU+y+h);
  c.fillStyle=col; c.fillRect(x0,y0,x1-x0,1); c.fillRect(x0,y1-1,x1-x0,1); c.fillRect(x0,y0,1,y1-y0); c.fillRect(x1-1,y0,1,y1-y0);
}
// Photo view: a die as it looks on a real wafer under light. Bronze/copper core, darker
// I/O band, muted aluminium pads (a few probe marks), pale-gold metal rings and stripes,
// SRAM arrays in the blue-violet they diffract to, gold top-metal inductor, light streets.
// Layers palette still applies: met1 = metal, li1 = std-cell texture, poly = array texture.
function drawCell(c){
  const L=LAYERS;
  const one=Math.max(1,px(1));
  let seed=11; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const box=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(px(x),px(y),px(x+w)-px(x),px(y+h)-px(y));};
  const ring=(x,y,w,h,t,col)=>{box(x,y,w,t,col);box(x,y+h-t,w,t,col);box(x,y,t,h,col);box(x+w-t,y,t,h,col);};
  box(0,0,96,96,'#3a2e20');                                         // die edge
  box(5,5,86,86,'#46372a');                                         // I/O band
  if(L.met1){ ring(0,0,96,96,1,'#cdbb8c'); ring(2,2,92,92,1,'#8e7c56'); }
  for(const [x,y] of [[6,6],[77,6],[6,77],[77,77]]) box(x,y,13,13,'#3f3226');
  for(let k=0;k<8;k++){
    const q=20+k*7, pwr=(k===2||k===5);
    const cells=[[[q,6,7,13],[q+1.5,7.5],[q+1,14,5,4],[q+2,19,3,3]],
                 [[q,77,7,13],[q+1.5,84.5],[q+1,78,5,4],[q+2,74,3,3]],
                 [[6,q,13,7],[7.5,q+1.5],[14,q+1,4,5],[19,q+2,3,3]],
                 [[77,q,13,7],[84.5,q+1.5],[78,q+1,4,5],[74,q+2,3,3]]];
    for(const [[cx,cy,cw,ch],[ax,ay],[dx,dy,dw,dh],strap] of cells){
      box(cx,cy,cw,ch,(k%2)?'#4a3a2b':'#463729');
      if(L.poly) box(dx,dy,dw,dh,'#4f4a2e');                         // driver / ESD devices
      if(L.met1){
        box(ax-.5,ay-.5,5,5,'#5d5040');                              // opening edge
        box(ax,ay,4,4,'#a59d8b');                                    // aluminium pad
        box(ax,ay,4,.5,'#bdb6a4');
        if(rnd()<.4) box(ax+1.2+rnd()*1.2,ay+1.2+rnd()*1.2,1,.5,'#7f786a');   // probe mark
        if(pwr) box(...strap,'#b39f6e');
      }
    }
  }
  box(21,21,54,54,'#5a4329');                                       // core (copper/bronze)
  if(L.met1){ ring(21,21,54,54,2,'#c9b37c'); ring(24,24,48,48,2,'#b7a06a'); }
  for(const [x,y,w,h] of [[28,28,16,12],[28,44,16,12]]){           // SRAM arrays
    box(x-1,y-1,w+2,h+2,'#a48f5f');
    box(x,y,w,h,'#3b3a78');
    if(L.poly){
      c.fillStyle='#4c4b93'; for(let u=x;u<x+w-3;u+=1.5) c.fillRect(px(u),px(y),one,px(h));
      c.fillStyle='#302f63'; for(let v=y+.5;v<y+h;v+=1.5) c.fillRect(px(x),px(v),px(w-3),one);
    }
    box(x+w-3,y,3,h,'#4a3b2a');
    if(L.met1) box(x,y+5,w,.7,'#b29d6a');
  }
  box(51,27,18,14,'#a48f5f'); box(52,28,16,12,'#3d3a2a');          // analog / PLL
  if(L.poly){ box(53,29,6,4,'#4f6a4a'); box(53,35,6,4,'#4f6a4a');
    c.fillStyle='#62805b'; for(let u=53.5;u<59;u+=1.2){c.fillRect(px(u),px(29),one,px(4));c.fillRect(px(u),px(35),one,px(4));} }
  if(L.met1){ c.fillStyle='#e0bd6c';
    let x0=60,y0=29,x1=67,y1=39;
    for(let t=0;t<3;t++){
      c.fillRect(px(x0),px(y0),px(x1-x0),one); c.fillRect(px(x1-1),px(y0),one,px(y1-y0));
      c.fillRect(px(x0),px(y1-1),px(x1-x0),one); c.fillRect(px(x0),px(y0+2),one,px(y1-y0-2));
      x0+=2;y0+=2;x1-=2;y1-=2; if(x1-x0<2||y1-y0<2)break;
    } }
  for(const [rx,ry,rw,rh] of [[46,43,23,14],[28,58,41,11]]){       // standard cells
    for(let y=ry;y<ry+rh;y+=2){
      box(rx,y,rw,2,(Math.round((y-ry)/2)%2)?'#6b5634':'#62502f');
      if(L.li1) for(let x=rx;x<rx+rw;x+=.5){
        const r=rnd();
        if(r<.16) box(x,y+.5,.5,1,'#80683e'); else if(r<.28) box(x,y+.5,.5,1,'#4c3d25'); else if(r<.33) box(x,y+.5,.5,1,'#5d6a3c');
      }
      if(L.met1) box(rx,y,rw,.4,'#7a6440');
    }
  }
  if(L.met1){ for(const sx of [49,55,61,67]) box(sx,26,.8,44,'#c2ad78'); for(const sx of [31,37,43]) box(sx,57,.8,13,'#c2ad78'); }
  box(97,44,2,8,'#d8d2c2'); box(94.5,47,7,2,'#d8d2c2');            // street: alignment cross
  for(let u=18;u<=42;u+=4) box(u,96.8,2,2.2,'#d2ccbc');            // street: PCM pads
}
function stampWafer(cv,ctx,drawFn,street,finish){
  cv.width=Math.round(W*K); cv.height=Math.round(W*K);
  F=K/2;
  ctx.save();
  ctx.setTransform(K,0,0,K,0,0);
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();
  ctx.fillStyle=street;ctx.fillRect(0,0,W,W);
  ctx.setTransform(1,0,0,1,0,0);
  const cell=document.createElement('canvas');
  cell.width=Math.round(PU*F); cell.height=Math.round(PVU*F);
  OXU=0; OYU=0; drawFn(cell.getContext('2d'));
  const WU=W*2, nx=Math.ceil(WU/PU)+1, ny=Math.ceil(WU/PVU)+1;
  const ox=Math.round((WU-nx*PU)/2), oy=Math.round((WU-ny*PVU)/2);
  for(let r=0;r<ny;r++) for(let k=0;k<nx;k++){
    const OX=ox+k*PU, OY=oy+r*PVU, x=OX/2, y=OY/2, cw=CU/2, ch=CHU/2;
    let inside=0;
    [[x,y],[x+cw,y],[x+cw,y+ch],[x,y+ch]].forEach(([u,v])=>{if(Math.hypot(u-CX,v-CY)<R-3)inside++;});
    if(inside<1) continue;
    ctx.drawImage(cell,px(OX),px(OY));
  }
  ctx.setTransform(K,0,0,K,0,0);
  finish(ctx);
  ctx.beginPath();ctx.arc(CX,CY,R-1,Math.PI*.44,Math.PI*.56);
  ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.stroke();
  ctx.restore();
}
function buildWaferBase(){
  stampWafer(offWaferBase,offCtx,drawCell,'#b3ab97',ctx=>{
    // film-thickness variation across the wafer: warm centre, cooler and greener toward the edge
    const t=ctx.createRadialGradient(CX*0.9,CY*0.85,R*0.1,CX,CY,R);
    t.addColorStop(0,'rgba(255,200,120,0.10)');t.addColorStop(0.55,'rgba(120,160,120,0.10)');t.addColorStop(1,'rgba(90,110,190,0.16)');
    ctx.globalCompositeOperation='soft-light';ctx.fillStyle=t;ctx.fillRect(0,0,W,W);ctx.globalCompositeOperation='source-over';
    const v=ctx.createRadialGradient(CX,CY,R*0.6,CX,CY,R);
    v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(0.82,'rgba(0,0,0,0.05)');v.addColorStop(0.96,'rgba(0,0,0,0.3)');v.addColorStop(1,'rgba(0,0,0,0.65)');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,W);
  });
}
SMALL.addEventListener('change',()=>{sizeCanvases();buildWaferBase();});
buildWaferBase();

function drawWafer(mnx,mny){
  wX.clearRect(0,0,W,W);wX.drawImage(offWaferBase,0,0,W,W);
  wX.save();wX.beginPath();wX.arc(CX,CY,R,0,Math.PI*2);wX.clip();
  const lightAngle=Math.atan2(-mny,-mnx);
  const shineArc=0.45,a0=lightAngle-shineArc,a1=lightAngle+shineArc;
  const tiltMag=Math.min(Math.sqrt(mnx*mnx+mny*mny),1);
  const shineAlpha=0.10+tiltMag*0.18;
  wX.beginPath();wX.arc(CX,CY,R-1,a0,a1);
  wX.strokeStyle=`rgba(200,220,255,${shineAlpha*0.5})`;wX.lineWidth=8;wX.lineCap='round';wX.stroke();
  wX.beginPath();wX.arc(CX,CY,R-1,a0,a1);
  wX.strokeStyle=`rgba(230,240,255,${shineAlpha})`;wX.lineWidth=1.5;wX.lineCap='round';wX.stroke();
  // thin-film interference: the rainbow sheen real wafers show, sliding with the tilt
  const ia=Math.atan2(mny,mnx)+0.6, sh=0.5+0.5*Math.sin(mnx*1.7+mny*1.3);
  const ig=wX.createLinearGradient(CX+Math.cos(ia)*R,CY+Math.sin(ia)*R,CX-Math.cos(ia)*R,CY-Math.sin(ia)*R);
  const A=0.16+tiltMag*0.14;
  ig.addColorStop(0,'rgba(0,0,0,0)');
  ig.addColorStop(Math.max(.05,.18+sh*.1),`rgba(255,120,200,${A})`);
  ig.addColorStop(.38+sh*.08,`rgba(110,190,255,${A})`);
  ig.addColorStop(.55+sh*.06,`rgba(120,255,180,${A})`);
  ig.addColorStop(.74+sh*.05,`rgba(255,220,120,${A})`);
  ig.addColorStop(1,'rgba(0,0,0,0)');
  wX.globalCompositeOperation='screen'; wX.fillStyle=ig; wX.fillRect(0,0,W,W); wX.globalCompositeOperation='source-over';
  const specX=CX+(-mnx)*R*0.5,specY=CY+(-mny)*R*0.5;
  const spec=wX.createRadialGradient(specX,specY,0,specX,specY,R*0.38);
  spec.addColorStop(0,`rgba(200,215,255,${0.05+tiltMag*0.07})`);spec.addColorStop(1,'rgba(0,0,0,0)');
  wX.fillStyle=spec;wX.fillRect(0,0,W,W);
  const shadowA0=lightAngle+Math.PI-shineArc*0.8,shadowA1=lightAngle+Math.PI+shineArc*0.8;
  wX.beginPath();wX.arc(CX,CY,R-1,shadowA0,shadowA1);
  wX.strokeStyle=`rgba(2,4,18,${0.45+tiltMag*0.25})`;wX.lineWidth=6;wX.lineCap='round';wX.stroke();
  wX.beginPath();wX.arc(CX,CY,R,0,Math.PI*2);
  wX.strokeStyle='#7a7a7a';wX.lineWidth=2;wX.stroke();
  wX.restore();
}

// ---- NAME ----
const nameOff=document.createElement('canvas');
nameOff.width=W*2;nameOff.height=W*2;
const nameOffCtx=nameOff.getContext('2d');
nameOffCtx.scale(2,2);nameOffCtx.font='bold 56px Arial';
const nameTW=nameOffCtx.measureText('Andrew Grau').width;
const nameX=Math.round((W-nameTW)/2),nameY=Math.round(CY+20);
nameOffCtx.fillStyle='#fff';nameOffCtx.fillText('Andrew Grau',nameX,nameY);
function getNamePath(){
  const o=document.createElement('canvas');o.width=W;o.height=W;
  const c=o.getContext('2d');c.font='bold 56px Arial';c.fillStyle='#fff';
  c.fillText('Andrew Grau',nameX,nameY);
  const d=c.getImageData(0,0,W,W).data;
  const pts=[];
  for(let x=0;x<W;x++)for(let y=0;y<W;y++)if(d[(y*W+x)*4+3]>80)pts.push({x,y});
  return pts;
}
const textPoints=getNamePath(),totalPts=textPoints.length;
function drawName(progress){
  nX.clearRect(0,0,W,W);if(progress<=0)return;
  const idx=Math.min(Math.floor(progress*totalPts),totalPts-1);
  const maxX=textPoints[idx]?.x??0;
  nX.save();nX.beginPath();nX.arc(CX,CY,R,0,Math.PI*2);nX.clip();
  nX.save();nX.beginPath();nX.rect(0,0,maxX+2,W);nX.clip();
  nX.shadowColor='rgba(180,120,255,1)';nX.shadowBlur=18;
  nX.drawImage(nameOff,0,0,W,W);nX.shadowBlur=0;
  nX.font='bold 56px Arial';nX.fillStyle='rgba(255,245,255,0.95)';
  nX.fillText('Andrew Grau',nameX,nameY);
  nX.globalCompositeOperation='screen';
  nX.shadowColor='rgba(200,140,255,1)';nX.shadowBlur=12;
  nX.fillStyle='rgba(200,150,255,0.5)';nX.fillText('Andrew Grau',nameX,nameY);
  nX.shadowBlur=0;nX.restore();nX.restore();
}

// ---- BEAM ----
function drawBeam(lx,ly,ts){
  bX.clearRect(0,0,BW,BW);
  const fx=lx+BOFF,fy=ly+BOFF;
  const sx=BW*0.72,sy=18;
  const hw=68;
  const lx1=sx-hw,ly1=sy,rx1=sx+hw,ry1=sy;
  const flash=0.92+0.08*Math.sin(ts*0.003);

  bX.save();

  const aura=bX.createRadialGradient(sx,sy+120,0,sx,sy+120,560);
  aura.addColorStop(0,`rgba(200,120,255,${0.38*flash})`);
  aura.addColorStop(0.18,`rgba(160,60,255,${0.22*flash})`);
  aura.addColorStop(0.45,`rgba(110,20,220,${0.10*flash})`);
  aura.addColorStop(1,'rgba(0,0,0,0)');
  bX.fillStyle=aura;
  bX.beginPath();bX.ellipse(sx,sy+160,540,420,0,0,Math.PI*2);bX.fill();

  bX.save();
  bX.beginPath();
  bX.moveTo(lx1,ly1);bX.lineTo(rx1,ry1);bX.lineTo(fx,fy);
  bX.closePath();
  bX.clip();

  bX.fillStyle=`rgba(180,80,255,1)`;
  bX.fillRect(0,0,BW,BW);

  const crossGlow=bX.createLinearGradient(lx1,0,rx1,0);
  crossGlow.addColorStop(0,   'rgba(160,50,255,1)');
  crossGlow.addColorStop(0.18,'rgba(210,130,255,1)');
  crossGlow.addColorStop(0.35,'rgba(245,200,255,1)');
  crossGlow.addColorStop(0.5, 'rgba(255,255,255,1)');
  crossGlow.addColorStop(0.65,'rgba(245,200,255,1)');
  crossGlow.addColorStop(0.82,'rgba(210,130,255,1)');
  crossGlow.addColorStop(1,   'rgba(160,50,255,1)');
  bX.fillStyle=crossGlow;
  bX.fillRect(0,0,BW,BW);

  const vertGlow=bX.createLinearGradient(sx,sy,fx,fy);
  vertGlow.addColorStop(0,  'rgba(255,255,255,0.0)');
  vertGlow.addColorStop(0.1,'rgba(255,240,255,0.35)');
  vertGlow.addColorStop(0.5,'rgba(220,160,255,0.15)');
  vertGlow.addColorStop(0.85,'rgba(200,120,255,0.08)');
  vertGlow.addColorStop(1,  'rgba(180,80,255,0.0)');
  bX.fillStyle=vertGlow;
  bX.fillRect(0,0,BW,BW);

  bX.restore();

  bX.save();
  bX.beginPath();bX.moveTo(lx1,ly1);bX.lineTo(fx,fy);bX.lineTo(lx1-45,ly1);bX.closePath();
  const eL=bX.createLinearGradient(lx1,0,lx1-45,0);
  eL.addColorStop(0,`rgba(200,100,255,${0.75*flash})`);
  eL.addColorStop(0.5,`rgba(160,60,255,${0.35*flash})`);
  eL.addColorStop(1,'rgba(120,20,255,0)');
  bX.fillStyle=eL;bX.fill();bX.restore();

  bX.save();
  bX.beginPath();bX.moveTo(rx1,ry1);bX.lineTo(fx,fy);bX.lineTo(rx1+45,ry1);bX.closePath();
  const eR=bX.createLinearGradient(rx1,0,rx1+45,0);
  eR.addColorStop(0,`rgba(200,100,255,${0.75*flash})`);
  eR.addColorStop(0.5,`rgba(160,60,255,${0.35*flash})`);
  eR.addColorStop(1,'rgba(120,20,255,0)');
  bX.fillStyle=eR;bX.fill();bX.restore();

  bX.beginPath();bX.moveTo(lx1,ly1);bX.lineTo(fx,fy);
  bX.strokeStyle=`rgba(240,180,255,${0.95*flash})`;bX.lineWidth=2.5;bX.stroke();
  bX.beginPath();bX.moveTo(rx1,ry1);bX.lineTo(fx,fy);
  bX.strokeStyle=`rgba(240,180,255,${0.95*flash})`;bX.lineWidth=2.5;bX.stroke();

  const srcGrad=bX.createLinearGradient(lx1,sy,rx1,sy);
  srcGrad.addColorStop(0,'rgba(160,50,255,0)');
  srcGrad.addColorStop(0.12,`rgba(230,160,255,${1.0*flash})`);
  srcGrad.addColorStop(0.5, `rgba(255,255,255,${1.0*flash})`);
  srcGrad.addColorStop(0.88,`rgba(230,160,255,${1.0*flash})`);
  srcGrad.addColorStop(1,'rgba(160,50,255,0)');
  bX.fillStyle=srcGrad;bX.fillRect(lx1-4,sy-8,hw*2+8,16);

  const srcHalo=bX.createRadialGradient(sx,sy,0,sx,sy,hw*1.8);
  srcHalo.addColorStop(0,`rgba(240,180,255,${0.80*flash})`);
  srcHalo.addColorStop(0.25,`rgba(200,100,255,${0.45*flash})`);
  srcHalo.addColorStop(0.6,`rgba(160,50,255,${0.18*flash})`);
  srcHalo.addColorStop(1,'rgba(0,0,0,0)');
  bX.fillStyle=srcHalo;bX.beginPath();bX.ellipse(sx,sy,hw*1.8,55,0,0,Math.PI*2);bX.fill();

  const surfPool=bX.createRadialGradient(fx,fy,0,fx,fy,85);
  surfPool.addColorStop(0,`rgba(240,180,255,${0.40*flash})`);
  surfPool.addColorStop(0.35,`rgba(180,80,255,${0.18*flash})`);
  surfPool.addColorStop(1,'rgba(0,0,0,0)');
  bX.beginPath();bX.ellipse(fx,fy,85,20,0,0,Math.PI*2);bX.fillStyle=surfPool;bX.fill();

  const tip=bX.createRadialGradient(fx,fy,0,fx,fy,16);
  tip.addColorStop(0,`rgba(255,255,255,${0.95*flash})`);
  tip.addColorStop(0.4,`rgba(220,150,255,${0.55*flash})`);
  tip.addColorStop(1,'rgba(0,0,0,0)');
  bX.beginPath();bX.arc(fx,fy,16,0,Math.PI*2);bX.fillStyle=tip;bX.fill();

  bX.restore();
}

let laserProgress=0,laserDone=false,last=0;
function reset(){laserProgress=0;laserDone=false;nX.clearRect(0,0,W,W);bX.clearRect(0,0,BW,BW);}
document.getElementById('redo-btn').addEventListener('click',reset);

function render(ts){
  requestAnimationFrame(render);
  if(!heroActive){last=ts;return;}
  const dt=Math.min((ts-last)/1000,0.05);last=ts;
  currentTX+=(targetTX-currentTX)*0.12;currentTY+=(targetTY-currentTY)*0.12;
  scene.style.transform=`rotateX(${currentTX}deg) rotateY(${currentTY}deg)`;
  currentMNX+=(mouseNX-currentMNX)*0.10;currentMNY+=(mouseNY-currentMNY)*0.10;
  drawBg(ts);drawWafer(currentMNX,currentMNY);
  if(!laserDone){
    laserProgress=Math.min(laserProgress+dt*0.55,1);
    if(laserProgress>=1)laserDone=true;
    drawName(laserProgress);
    if(!laserDone){
      const idx=Math.min(Math.floor(laserProgress*totalPts),totalPts-1);
      drawBeam(textPoints[idx].x,textPoints[idx].y,ts);
    } else bX.clearRect(0,0,BW,BW);
  } else drawName(1);
}

hero.addEventListener('mousemove',e=>{
  const r=hero.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width-0.5,ny=(e.clientY-r.top)/r.height-0.5;
  mouseNX=nx*2;mouseNY=ny*2;targetTX=ny*-24;targetTY=nx*28;
});
hero.addEventListener('mouseleave',()=>{
  targetTX=0;targetTY=0;mouseNX=0;mouseNY=0;
});
requestAnimationFrame(render);

/* ---------------- cursor routing ----------------
   Moving the mouse lays wire on the page grid like routing in the layout editor.
   Every bend switches layer (met1 → li1 → poly → tap → diff → …) through an mcon,
   using the same stipples as the wafer. Each piece fades after LIFE ms. */
(function(){
  const fine=matchMedia('(pointer:fine)').matches, calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const cv=document.getElementById('wires');
  if(!fine||calm||!cv) return;
  const x=cv.getContext('2d');
  const G=28, O=14, LIFE=1800, VIA=9;
  const snap=v=>Math.round((v-O)/G)*G+O;
  let segs=[], vias=[], last=null, lastDir='', li=0, running=false;
  function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;x.setTransform(DPR,0,0,DPR,0,0);}
  size(); addEventListener('resize',size);
  const P=makePats(x);
  const STYLE={
    met1:{w:8,fill:P.met1,edge:'#4a4aff'},
    li1: {w:7,fill:P.li1, edge:'#f2e8d0'},
    poly:{w:6,fill:P.poly,edge:'#e43222'},
    tap: {w:8,fill:P.tap, edge:'#d0c641'},
    diff:{w:7,fill:P.diff,edge:'#7dff7d'}
  };
  const CYCLE=['met1','li1','poly','tap','diff'];
  const off=l=>document.body.classList.contains('off-'+l);
  function add(x1,y1,x2,y2,now){
    if(x1===x2&&y1===y2) return;
    const dir=y1===y2?'h':'v';
    if(lastDir&&dir!==lastDir){ vias.push({x:x1,y:y1,t:now}); li=(li+1)%CYCLE.length; }
    segs.push({x1,y1,x2,y2,layer:CYCLE[li],t:now}); lastDir=dir;
  }
  addEventListener('mousemove',e=>{
    const now=performance.now();
    const p={x:snap(e.clientX+scrollX), y:snap(e.clientY+scrollY)};
    if(!last||Math.abs(p.x-last.x)+Math.abs(p.y-last.y)>G*16){last=p;lastDir='';return;}
    if(p.x===last.x&&p.y===last.y) return;
    if(lastDir==='v'){ add(last.x,last.y,last.x,p.y,now); add(last.x,p.y,p.x,p.y,now); }
    else             { add(last.x,last.y,p.x,last.y,now); add(p.x,last.y,p.x,p.y,now); }
    last=p;
    if(!running){running=true;requestAnimationFrame(draw);}
  },{passive:true});
  addEventListener('mouseout',e=>{if(!e.relatedTarget){last=null;lastDir='';}});
  function draw(now){
    x.clearRect(0,0,innerWidth,innerHeight);
    segs=segs.filter(s=>now-s.t<LIFE); vias=vias.filter(v=>now-v.t<LIFE);
    const sx=scrollX, sy=scrollY, a=t=>{const k=(now-t)/LIFE;return k<.35?1:Math.max(0,1-(k-.35)/.65);};
    x.lineWidth=1;
    for(const s of segs){
      if(off(s.layer)) continue;
      const st=STYLE[s.layer], w=st.w;
      const l=Math.min(s.x1,s.x2)-w/2-sx, t=Math.min(s.y1,s.y2)-w/2-sy;
      const W2=Math.abs(s.x2-s.x1)+w, H2=Math.abs(s.y2-s.y1)+w;
      x.globalAlpha=a(s.t);
      x.fillStyle=st.fill; x.fillRect(l,t,W2,H2);
      x.strokeStyle=st.edge; x.strokeRect(l+.5,t+.5,W2-1,H2-1);
    }
    if(!off('mcon')) for(const v of vias){
      x.globalAlpha=a(v.t);
      x.fillStyle='#961de7'; x.fillRect(v.x-VIA/2-sx,v.y-VIA/2-sy,VIA,VIA);
      x.strokeStyle='#c27cff'; x.strokeRect(v.x-VIA/2-sx+.5,v.y-VIA/2-sy+.5,VIA-1,VIA-1);
    }
    x.globalAlpha=1;
    if(segs.length||vias.length) requestAnimationFrame(draw); else {running=false;x.clearRect(0,0,innerWidth,innerHeight);}
  }
  addEventListener('scroll',()=>{if(!running&&segs.length){running=true;requestAnimationFrame(draw);}},{passive:true});
})();

/* ---------------- Layers palette ---------------- */
(function(){
  const tab=document.getElementById('lsw-tab'), panel=document.getElementById('lsw-panel');
  const open=v=>{panel.hidden=!v;tab.setAttribute('aria-expanded',v);};
  tab.addEventListener('click',()=>open(panel.hidden));
  document.getElementById('lsw-x').addEventListener('click',()=>open(false));
  panel.querySelectorAll('input[data-l]').forEach(cb=>cb.addEventListener('change',()=>{
    const l=cb.dataset.l;
    document.body.classList.toggle('off-'+l,!cb.checked);
    if(l in LAYERS){LAYERS[l]=cb.checked;buildWaferBase();}
  }));
})();

route();
</script>
